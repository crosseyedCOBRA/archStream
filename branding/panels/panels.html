<!doctype html>
<!--
  Twitch / Kick channel panels, 320x100.
  Open in a browser to preview all of them; render.sh turns each one into a PNG
  by loading this page with ?panel=<id>.
  To change a panel's text, edit PANELS below and re-run render.sh.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>crosseyedCOBRA panels</title>
<link rel="stylesheet" href="../brand.css">
<style>
  html, body { margin: 0; }
  body {
    background: #2b2d2a;
    display: flex; flex-direction: column; gap: 16px;
    padding: 24px;
  }
  body.single { background: transparent; padding: 0; gap: 0; }

  .panel {
    position: relative;
    width: 320px; height: 100px;
    box-sizing: border-box;
    overflow: hidden;
    /* green frame with a cut corner, like the logo's shield edge */
    background: var(--cobra-green);
    clip-path: polygon(0 0, 100% 0, 100% 72%, 94% 100%, 0 100%);
  }
  .panel .inner {
    position: absolute; inset: 4px;
    background:
      radial-gradient(circle at 18% 50%, rgba(171, 202, 51, .22), transparent 55%),
      repeating-linear-gradient(135deg, rgba(255,255,255,.025) 0 6px, transparent 6px 12px),
      var(--cobra-ink);
    clip-path: polygon(0 0, 100% 0, 100% 71%, 94% 100%, 0 100%);
    box-shadow: inset 0 0 0 2px var(--cobra-black);
  }
  /* gold accent stripe along the bottom */
  .panel .inner::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
    background: var(--cobra-gold-fill);
  }
  .panel img {
    position: absolute; left: 6px; top: 50%;
    height: 86px; transform: translateY(-50%);
    filter: drop-shadow(2px 2px 2px rgba(0,0,0,.6));
  }
  .panel .text {
    position: absolute; left: 100px; right: 14px; top: 0; bottom: 4px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .panel .title { font-size: 30px; line-height: 1; letter-spacing: .5px; }
  .panel .title.long { font-size: 25px; }
  .panel .tag { font-size: 17px; line-height: 1.2; margin-top: 4px; }
</style>
</head>
<body>
<script>
  const PANELS = [
    { id: "about",     title: "ABOUT",     tag: "who's the cobra?" },
    { id: "schedule",  title: "SCHEDULE",  tag: "when i'm live" },
    { id: "subscribe", title: "SUBSCRIBE", tag: "join the snake pit", long: true },
    { id: "tips",      title: "TIPS",      tag: "feed the cobra" },
    { id: "youtube",   title: "YOUTUBE",   tag: "vods & clips" },
    { id: "discord",   title: "DISCORD",   tag: "hang in the pit" },
  ];

  const only = new URLSearchParams(location.search).get("panel");
  if (only) document.body.classList.add("single");

  for (const p of PANELS) {
    if (only && p.id !== only) continue;
    const el = document.createElement("div");
    el.className = "panel";
    el.id = p.id;
    el.innerHTML = `
      <div class="inner"></div>
      <img src="../logo-256.png" alt="">
      <div class="text">
        <div class="title gold-text${p.long ? " long" : ""}"></div>
        <div class="tag white-text"></div>
      </div>`;
    el.querySelector(".title").textContent = p.title;
    el.querySelector(".tag").textContent = p.tag;
    document.body.appendChild(el);
  }
</script>
</body>
</html>
